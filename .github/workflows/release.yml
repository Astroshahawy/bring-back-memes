name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd src && zip -r ../bring-back-memes-${{ github.ref_name }}.zip .
      - uses: softprops/action-gh-release@v2
        with:
          files: bring-back-memes-*.zip
